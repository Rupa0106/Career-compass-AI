<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Planner | CareerCompass AI</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
<header>
    <h2>CareerCompass AI</h2>
    <nav><a href="dashboard.html">Dashboard</a><a href="roadmap.html">Roadmap</a></nav>
</header>

<main class="container">
    <h1>Study Planner</h1>
    <p>Create tasks and track your daily learning activities.</p>

    <form id="taskForm">
        <label for="task">Task</label>
        <input id="task" required placeholder="Example: Practice Python functions">

        <label for="date">Deadline</label>
        <input id="date" type="date" required>

        <button type="submit">Add Task</button>
    </form>

    <h2>My Tasks</h2>
    <ul id="taskList"></ul>
    <p id="progress">Completed: 0 / 0</p>
</main>

<script src="js/api.js"></script>
<script src="js/planner.js"></script>
</body>
</html>
